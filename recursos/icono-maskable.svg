<!--
  ÍCONO "MASKABLE" PARA LA PWA · EL SELLO DE CERA
  El mismo lacre con la "A" que el favicon, pero centrado y más chico, con
  un fondo oscuro a sangre alrededor. Android recorta el ícono con formas
  distintas según el teléfono; el margen (la "zona segura") hace que esos
  recortes nunca coman el sello. De la forma exterior se encarga el sistema,
  por eso el fondo es liso y sin esquinas redondeadas.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="cera" cx="40%" cy="32%" r="74%">
      <stop offset="0%"   stop-color="#bd3149"/>
      <stop offset="42%"  stop-color="#8a1e30"/>
      <stop offset="78%"  stop-color="#54111f"/>
      <stop offset="100%" stop-color="#2c0812"/>
    </radialGradient>
    <linearGradient id="cera-a-oro" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#e8d290"/>
      <stop offset="50%"  stop-color="#c1a049"/>
      <stop offset="100%" stop-color="#8a6a2c"/>
    </linearGradient>
    <!-- La foto de la firma es amarillo puro, no el dorado antiguo del
         resto de la web: acá solo se usa su silueta (canal alfa) como
         máscara, y el color lo pone el degradado de arriba. El <image>
         de adentro va agrandado y corrido: ver la explicación completa
         en recursos/icono.svg (la tinta está pegada al borde izquierdo
         de la foto, así que dibujarla completa centrada se veía corrida). -->
    <mask id="mascara-firma" maskUnits="userSpaceOnUse"
          x="20" y="16" width="24" height="32" mask-type="alpha">
      <image href="logo-dibujado-por-lucila.png" x="20" y="14.47" width="26.22" height="35.37"/>
    </mask>
  </defs>

  <!-- Fondo a sangre (el sistema le dará la forma) -->
  <rect width="512" height="512" fill="#0a0605"/>

  <!-- El sello, centrado y dentro de la zona segura (el dibujo de 64 se
       lleva al centro de 512 y se escala ~5). -->
  <g transform="translate(256 256) scale(5) translate(-32 -32)">
    <path d="M32 4 C 45 4,53 11,57 23 C 60 34,56 47,45 55 C 34 61,21 59,13 50
             C 5 41,5 29,10 19 C 14 10,22 5,32 4 Z" fill="url(#cera)"/>
    <g fill="#7a1728">
      <circle cx="55" cy="15" r="2.1"/>
      <circle cx="12" cy="47" r="1.7"/>
      <circle cx="50" cy="52" r="1.5"/>
    </g>
    <circle cx="32" cy="32" r="23" fill="none" stroke="#3a0c17" stroke-width="2" opacity=".55"/>
    <path d="M14 27 A 23 23 0 0 1 50 27" fill="none" stroke="#d9738a"
          stroke-width="1.4" stroke-opacity=".35" stroke-linecap="round"/>
    <ellipse cx="24" cy="21" rx="6" ry="3.4" fill="#f0aab6" opacity=".28"/>
    <!-- La "A" que dibujó Lucila para su hija (ver recursos/icono.svg,
         misma imagen, misma máscara, mismo criterio: la gota de cera
         queda de fondo). -->
    <rect x="20" y="16" width="24" height="32" fill="url(#cera-a-oro)"
          mask="url(#mascara-firma)"
          style="filter: drop-shadow(1px 1.5px 1px rgba(58,12,23,.8))"/>
  </g>
</svg>
