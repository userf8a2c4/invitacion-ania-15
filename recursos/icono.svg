<!--
  ÍCONO DE LA PESTAÑA (favicon) · EL SELLO DE CERA
  Es el mismo lacre rojo que cierra el sobre de la invitación, con la "A"
  que dibujó Lucila para su hija grabada encima (recursos/logo-dibujado-
  por-lucila.png). Se ve muy chico (16×16 px), así que la gota de cera se
  conserva como fondo: es lo que da contraste y hace que se identifique
  como sello a ese tamaño, algo que el trazo solo, sin fondo, no lograría.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <defs>
    <!-- Cera: roja, con el brillo corrido arriba-izquierda (volumen) -->
    <radialGradient id="cera" cx="40%" cy="32%" r="74%">
      <stop offset="0%"   stop-color="#bd3149"/>
      <stop offset="42%"  stop-color="#8a1e30"/>
      <stop offset="78%"  stop-color="#54111f"/>
      <stop offset="100%" stop-color="#2c0812"/>
    </radialGradient>
    <linearGradient id="cera-a-oro" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#e8d290"/>
      <stop offset="50%"  stop-color="#c1a049"/>
      <stop offset="100%" stop-color="#8a6a2c"/>
    </linearGradient>
    <!-- La foto de la firma es amarillo puro (#ffea3c), no el dorado
         antiguo del resto de la web. Acá se usa solo su SILUETA (canal
         alfa) como máscara, y el color de verdad lo pone el degradado de
         arriba —el mismo dorado envejecido que ya tenía la "A" antes.

         ⚠️ EL <image> DE ADENTRO ESTÁ AGRANDADO Y CORRIDO A PROPÓSITO.
         La foto (687×927) tiene la tinta pegada al borde izquierdo y con
         bastante aire a la derecha; dibujarla completa centrada dejaba la
         letra visualmente corrida hacia la izquierda. Estos números
         recortan a la caja real de tinta (medida decodificando los
         píxeles del PNG: x 0-629, y 40-880 de 687×927) y la escalan para
         que llene justo la caja de la máscara (x/y/width/height de acá
         arriba, que es la que de verdad se ve). -->
    <mask id="mascara-firma" maskUnits="userSpaceOnUse"
          x="20" y="16" width="24" height="32" mask-type="alpha">
      <image href="logo-dibujado-por-lucila.png" x="20" y="14.47" width="26.22" height="35.37"/>
    </mask>
  </defs>

  <!-- La gota de cera: un círculo con el borde irregular, como cuando la
       cera cae y se aplasta con el cuño. -->
  <path d="M32 4 C 45 4,53 11,57 23 C 60 34,56 47,45 55 C 34 61,21 59,13 50
           C 5 41,5 29,10 19 C 14 10,22 5,32 4 Z" fill="url(#cera)"/>
  <!-- salpicaduras del lacre alrededor -->
  <g fill="#7a1728">
    <circle cx="55" cy="15" r="2.1"/>
    <circle cx="12" cy="47" r="1.7"/>
    <circle cx="50" cy="52" r="1.5"/>
  </g>

  <!-- Reborde levantado del cuño: un aro con luz arriba y sombra abajo -->
  <circle cx="32" cy="32" r="23" fill="none" stroke="#3a0c17" stroke-width="2" opacity=".55"/>
  <path d="M14 27 A 23 23 0 0 1 50 27" fill="none" stroke="#d9738a"
        stroke-width="1.4" stroke-opacity=".35" stroke-linecap="round"/>

  <!-- brillo especular de la cera pulida -->
  <ellipse cx="24" cy="21" rx="6" ry="3.4" fill="#f0aab6" opacity=".28"/>

  <!-- La "A" que dibujó Lucila para su hija, no una inventada por nosotros,
       recoloreada al dorado de la web con la máscara de arriba. Se
       conserva la gota de lacre como fondo (es lo que la hace legible a
       16×16 px; el trazo solo, sin fondo, se perdería a ese tamaño) y el
       drop-shadow sugiere que está hundida en la cera, como el grabado
       que tenía antes. -->
  <rect x="20" y="16" width="24" height="32" fill="url(#cera-a-oro)"
        mask="url(#mascara-firma)"
        style="filter: drop-shadow(1px 1.5px 1px rgba(58,12,23,.8))"/>
</svg>
