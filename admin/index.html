<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ania XV · Administración</title>

<!-- ══════════════════════════════════════════════════════════════════
     PANEL DE ADMINISTRACIÓN · UNA SOLA PÁGINA

     CÓMO ESTÁ ARMADO ESTE ARCHIVO
     Toda la app vive acá adentro. No hay páginas separadas: se muestra
     y se esconde cada vista con JavaScript. Eso es lo que hace que al
     cambiar de pestaña no parpadee nada, como en una app de verdad.

     ÍNDICE
       1. Pantalla de carga
       2. Pantalla de entrada (login)
       3. La app: encabezado, vistas y navegación de abajo
       4. Piezas que se reusan: hojas, avisos, botón de notas
     ══════════════════════════════════════════════════════════════════ -->

<meta name="description" content="Panel de administración de los XV años de Ania">
<meta name="theme-color" content="#08050C">

<!-- Que iOS lo trate como app al instalarlo desde "Agregar a inicio". -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Ania Admin">
<link rel="apple-touch-icon" href="recursos/icono-admin.svg">

<!-- Esto es un panel privado: que ningún buscador lo indexe jamás. -->
<meta name="robots" content="noindex, nofollow, noarchive">

<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="recursos/icono-admin.svg" type="image/svg+xml">

<link rel="stylesheet" href="estilos/01-fundamentos.css">
<link rel="stylesheet" href="estilos/02-componentes.css">
<link rel="stylesheet" href="estilos/03-vistas.css">
</head>

<body>

<!-- ═══ 1. PANTALLA DE CARGA ═══════════════════════════════════════════
     Se ve el instante que tarda en comprobarse si la sesión guardada
     sigue sirviendo. Sin esto, parpadearía el login por medio segundo
     cada vez que se abre la app aunque ya estuvieras dentro. -->
<div id="pantalla-carga" class="pantalla-carga">
  <div class="pantalla-carga__marca">Ania <span>XV</span></div>
  <p id="frase-bienvenida" class="pantalla-carga__frase"></p>
  <div class="puntos" aria-label="Cargando">
    <span></span><span></span><span></span>
  </div>
</div>


<!-- ═══ 2. PANTALLA DE ENTRADA ═════════════════════════════════════════ -->
<div id="pantalla-entrada" class="pantalla-entrada oculto">
  <form id="forma-entrada" class="tarjeta-entrada" novalidate>
    <h1 class="tarjeta-entrada__titulo">Ania <span>XV</span></h1>
    <p class="tarjeta-entrada__bajada">Panel de administración</p>

    <label class="campo">
      <span class="campo__rotulo">Correo</span>
      <!-- inputmode y autocomplete hacen que el teléfono muestre el
           teclado correcto y ofrezca la contraseña guardada. -->
      <input type="email" id="entrada-correo" class="campo__control"
             autocomplete="username" inputmode="email"
             autocapitalize="off" spellcheck="false" required>
    </label>

    <label class="campo">
      <span class="campo__rotulo">Contraseña</span>
      <span class="campo__con-boton">
        <input type="password" id="entrada-contrasena" class="campo__control"
               autocomplete="current-password" required>
        <!-- Para poder revisar que se escribió bien antes de mandar el
             formulario. Los dos íconos (ojo abierto / ojo tachado) ya
             están los dos en el HTML; 04-sesion.js solo alterna cuál
             se ve, junto con el type del input. -->
        <button type="button" id="entrada-ver-clave" class="campo__boton-ojo"
                aria-label="Mostrar contraseña" aria-pressed="false">
          <svg viewBox="0 0 24 24" aria-hidden="true" class="icono campo__boton-ojo-icono" data-ojo="abierto">
            <path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7-10-7-10-7Z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/>
            <circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="1.5"/>
          </svg>
          <svg viewBox="0 0 24 24" aria-hidden="true" class="icono campo__boton-ojo-icono oculto" data-ojo="cerrado">
            <path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7-10-7-10-7Z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/>
            <circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="1.5"/>
            <path d="M3 3l18 18" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
          </svg>
        </button>
      </span>
    </label>

    <p id="entrada-error" class="aviso-error oculto" role="alert"></p>

    <button type="submit" id="entrada-boton" class="boton boton--principal boton--ancho">
      Entrar
    </button>

    <button type="button" id="entrada-olvide" class="tarjeta-entrada__olvide">
      ¿Olvidaste tu contraseña?
    </button>
  </form>
</div>


<!-- ═══ 3. LA APP ══════════════════════════════════════════════════════ -->
<div id="app" class="app oculto">

  <!-- ─── Encabezado ─────────────────────────────────────────────────── -->
  <header class="encabezado">
    <div class="encabezado__lado">
      <h1 id="titulo-vista" class="encabezado__titulo">Resumen</h1>
      <p id="subtitulo-vista" class="encabezado__subtitulo"></p>
      <!-- El único contador persistente del panel (brief Lucila): vive
           acá, aparte de #subtitulo-vista, porque cada pantalla pisa el
           subtítulo con lo suyo — este no se pisa nunca, se calcula una
           vez al arrancar (ver actualizarContadorDeDias(), 05-navegacion.js)
           y queda quieto sin importar a qué pestaña se navegue. Empieza
           oculto: si CONFIGURACION.fiesta todavía no cargó, mejor nada
           que un "NaN días". -->
      <p id="contador-dias" class="encabezado__contador oculto"></p>
    </div>
    <!-- Los dos botones van juntos en una caja porque el encabezado usa
         space-between: sueltos, la lupa se iría al medio de la pantalla. -->
    <div class="encabezado__acciones">
      <!-- La lupa busca en TODO el panel a la vez, no solo en la pestaña
           donde uno esté. Va acá, a la vista desde cualquier pantalla:
           con esta cantidad de datos, "¿dónde lo cargué?" es la pregunta
           que más tiempo hace perder. -->
      <!-- Aparece SOLO cuando el Service Worker activó una versión nueva
           de verdad (VERSION cambió en sw.js) mientras esta pestaña ya
           estaba abierta con una vieja — nunca por archivos a medio
           subir: el navegador solo detecta una versión nueva cuando ese
           número cambió en el servidor. Ver 20-arranque.js. Empieza
           oculto y sigue oculto toda la vida de la pestaña salvo que
           esto pase de verdad. -->
      <button id="boton-actualizar" class="boton-icono oculto" aria-label="Hay una versión nueva — tocar para actualizar">
        <svg viewBox="0 0 24 24" aria-hidden="true" class="icono">
          <path d="M12 4v10m0 0l-4-4m4 4l4-4" fill="none" stroke="currentColor"
                stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M5 18v1a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-1" fill="none"
                stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
        </svg>
      </button>
      <button id="boton-buscar" class="boton-icono" aria-label="Buscar en todo">
        <svg viewBox="0 0 24 24" aria-hidden="true" class="icono">
          <circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="1.5"/>
          <path d="M16.5 16.5L21 21" stroke="currentColor" stroke-width="1.5"
                stroke-linecap="round"/>
        </svg>
      </button>
      <!-- La campana: avisos reales tomados de hoy.php (pagos por vencer,
           tareas atrasadas, cambios rechazados de la cola offline). Ver
           37-campana.js. Su burbuja NUNCA comparte contador con la de
           sincronizar: una cuenta avisos, la otra cuenta cambios sin
           mandar — son cosas distintas aunque las dos usen ponerBurbuja(). -->
      <button id="boton-campana" class="boton-icono" aria-label="Avisos">
        <svg viewBox="0 0 24 24" aria-hidden="true" class="icono">
          <path d="M12 3a5 5 0 0 0-5 5v3.2c0 .6-.2 1.2-.6 1.7L5 15h14l-1.4-2.1a2.8 2.8 0 0 1-.6-1.7V8a5 5 0 0 0-5-5Z"
                fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/>
          <path d="M10 18a2 2 0 0 0 4 0" fill="none" stroke="currentColor"
                stroke-width="1.5" stroke-linecap="round"/>
        </svg>
        <em id="burbuja-campana" class="burbuja oculto"></em>
      </button>
      <!-- Antes acá estaban los tres puntitos del menú. Con las cuatro
           pestañas de abajo, "Más" ya es una de ellas — el menú no
           necesita un segundo camino. Este botón sincroniza a mano:
           reusa sincronizarCola() (26-sincronizacion.js), la misma cola
           que ya manda los cambios encolados sin señal. -->
      <button id="boton-sincronizar" class="boton-icono" aria-label="Sincronizar ahora">
        <svg viewBox="0 0 24 24" aria-hidden="true" class="icono">
          <path d="M3 12a9 9 0 0 1 15-6.7M21 12a9 9 0 0 1-15 6.7"
                fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
          <path d="M18 3v4h-4M6 21v-4h4" fill="none" stroke="currentColor"
                stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <em id="burbuja-cola" class="burbuja oculto"></em>
      </button>
    </div>
  </header>

  <!-- ─── Aviso de conexión ──────────────────────────────────────────── -->
  <div id="banner-conexion" class="banner-conexion oculto"></div>

  <!-- ─── Las ocho vistas ────────────────────────────────────────────── -->
  <!-- Solo una tiene la clase "activa" a la vez. El JS las intercambia.
       Las cinco de siempre (Resumen, Gente, Correo, Presupuesto, Evento)
       siguen existiendo tal cual: ya no tienen botón propio abajo, pero
       se llega a ellas desde Planificar y desde los accesos de Resumen,
       así que irA('dinero'), ensuciarVistas('evento') y los atajos del
       icono de la app (?ir=dinero) siguen funcionando sin tocarlos. -->
  <main id="contenido" class="contenido">

    <section id="vista-hoy"        class="vista activa" data-vista="hoy"></section>
    <section id="vista-resumen"    class="vista"         data-vista="resumen"></section>
    <section id="vista-planificar" class="vista"         data-vista="planificar"></section>
    <section id="vista-mas"        class="vista"         data-vista="mas"></section>

    <section id="vista-invitados" class="vista" data-vista="invitados"></section>
    <section id="vista-correo"    class="vista" data-vista="correo"></section>
    <section id="vista-dinero"    class="vista" data-vista="dinero"></section>
    <section id="vista-evento"    class="vista" data-vista="evento"></section>

  </main>

  <!-- ─── Botón flotante de acción rápida (FAB) ─────────────────────── -->
  <!-- Antes era solo "nota rápida"; ahora es la capa de mínimo esfuerzo
       de Lucila: un toque abre el asistente (cuando exista) o, mientras
       tanto, el sandwich de herramientas configurado. Un toque largo
       siempre abre el sandwich, tenga el asistente o no. Ver
       codigo/29-fab.js. -->
  <button id="boton-accion" class="boton-flotante" aria-label="Acción rápida">
    <svg viewBox="0 0 24 24" aria-hidden="true" class="icono">
      <path d="M13 2 3 14h7l-1 8 10-12h-7l1-8z" fill="currentColor"/>
    </svg>
  </button>

  <!-- ─── Navegación de abajo: los cuatro modos ──────────────────────── -->
  <!-- Abajo y no arriba a propósito: es donde llega el pulgar cuando se
       sostiene el teléfono con una mano, que es como se va a usar esto
       la mayoría de las veces. -->
  <nav class="navegacion" aria-label="Secciones">
    <button class="navegacion__boton activa" data-ir="hoy">
      <svg viewBox="0 0 24 24" aria-hidden="true" class="icono">
        <rect x="3" y="4" width="18" height="17" rx="2.5" fill="none"
              stroke="currentColor" stroke-width="1.5"/>
        <path d="M3 9h18M8 2v4M16 2v4" fill="none" stroke="currentColor"
              stroke-width="1.5" stroke-linecap="round"/>
        <circle cx="12" cy="15" r="2.4"/>
      </svg>
      <span>Hoy</span>
    </button>

    <button class="navegacion__boton" data-ir="resumen">
      <svg viewBox="0 0 24 24" aria-hidden="true" class="icono">
        <rect x="3" y="3" width="7" height="9" rx="1.5"/>
        <rect x="14" y="3" width="7" height="5" rx="1.5"/>
        <rect x="14" y="10" width="7" height="11" rx="1.5"/>
        <rect x="3" y="14" width="7" height="7" rx="1.5"/>
      </svg>
      <span>Resumen</span>
      <em id="burbuja-resumen" class="burbuja burbuja--alerta oculto"></em>
    </button>

    <button class="navegacion__boton" data-ir="planificar">
      <svg viewBox="0 0 24 24" aria-hidden="true" class="icono">
        <path d="M4 5h16M4 12h16M4 19h10" fill="none" stroke="currentColor"
              stroke-width="1.5" stroke-linecap="round"/>
      </svg>
      <span>Planificar</span>
      <em id="burbuja-correo" class="burbuja oculto"></em>
    </button>

    <button class="navegacion__boton" data-ir="mas">
      <svg viewBox="0 0 24 24" aria-hidden="true" class="icono">
        <circle cx="12" cy="5" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="12" cy="19" r="2"/>
      </svg>
      <span>Más</span>
    </button>
  </nav>
</div>


<!-- ═══ 4. PIEZAS QUE SE REUSAN ════════════════════════════════════════ -->

<!-- Hoja que sube desde abajo. Es UNA sola para toda la app: el JS le
     cambia el título y el contenido según lo que haya que mostrar. Tener
     una sola evita que queden diez formularios escondidos en el HTML. -->
<div id="hoja" class="hoja oculto" role="dialog" aria-modal="true" aria-labelledby="hoja-titulo">
  <div id="hoja-fondo" class="hoja__fondo"></div>
  <div class="hoja__panel">
    <div class="hoja__agarre" aria-hidden="true"></div>
    <header class="hoja__encabezado">
      <h2 id="hoja-titulo" class="hoja__titulo"></h2>
      <button id="hoja-cerrar" class="boton-icono" aria-label="Cerrar">
        <svg viewBox="0 0 24 24" aria-hidden="true" class="icono">
          <path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="1.5"
                stroke-linecap="round"/>
        </svg>
      </button>
    </header>
    <div id="hoja-cuerpo" class="hoja__cuerpo"></div>
  </div>
</div>

<!-- El visor de imágenes y PDF de un adjunto (Fase 7 del rediseño). Una
     sola capa para toda la app, igual que #hoja: correo y archivos la
     comparten en vez de tener cada uno la suya. -->
<div id="visor-archivo" class="visor-archivo oculto" role="dialog" aria-modal="true">
  <header class="visor-archivo__barra">
    <span id="visor-archivo-nombre" class="visor-archivo__nombre"></span>
    <a id="visor-archivo-bajar" class="boton-icono" aria-label="Bajar" download>
      <svg viewBox="0 0 24 24" aria-hidden="true" class="icono">
        <path d="M12 4v11m0 0l-4-4m4 4l4-4M5 19h14" stroke="currentColor"
              stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      </svg>
    </a>
    <button id="visor-archivo-cerrar" class="boton-icono" aria-label="Cerrar">
      <svg viewBox="0 0 24 24" aria-hidden="true" class="icono">
        <path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="1.5"
              stroke-linecap="round"/>
      </svg>
    </button>
  </header>
  <div id="visor-archivo-cuerpo" class="visor-archivo__cuerpo"></div>
</div>

<!-- El menú ahora es una hoja más (ver codigo/05-navegacion.js,
     abrirMenuPrincipal()), armada desde CONFIGURACION.indiceDelMenu con
     el mismo patrón que el índice de Evento: grupos con título y una
     línea que dice qué hace cada opción. Ya no hay HTML fijo acá — el
     botón de los tres puntitos abre la hoja compartida (#hoja). -->

<!-- El globo de ayuda que se abre al tocar un "?".

     Es una capa APARTE de la hoja de abajo, a propósito: si usara la
     hoja, tocar el "?" mientras se está llenando un formulario borraría
     todo lo escrito. La ayuda nunca puede costar trabajo. -->
<div id="globo" class="globo oculto" role="dialog" aria-modal="true"
     aria-labelledby="globo-titulo">
  <div id="globo-fondo" class="globo__fondo"></div>
  <div class="globo__caja">
    <h2 id="globo-titulo" class="globo__titulo"></h2>
    <p id="globo-texto" class="globo__texto"></p>
    <button id="globo-cerrar" class="boton boton--principal boton--ancho">
      Entendido
    </button>
  </div>
</div>

<!-- Mensajito que aparece abajo y se va solo ("Guardado", "Sin conexión"…). -->
<div id="tostada" class="tostada oculto" role="status" aria-live="polite"></div>

<!-- El globo de novedades: una tarjeta chica que apunta a un botón o
     elemento puntual para explicar algo nuevo, en lenguaje simple. Ver
     codigo/31-novedades.js. Vive suelto en el body, no dentro de #app,
     porque también se usa en la pantalla de login. -->
<div id="novedad" class="novedad oculto" role="status" aria-live="polite">
  <div id="novedad-flecha" class="novedad__flecha"></div>
  <div class="novedad__tarjeta">
    <p id="novedad-contador" class="novedad__contador"></p>
    <p id="novedad-texto" class="novedad__texto"></p>
    <button type="button" id="novedad-boton" class="boton boton--principal novedad__boton">
      Siguiente
    </button>
  </div>
</div>


<!-- ═══ CÓDIGO ═════════════════════════════════════════════════════════
     El orden importa: cada archivo usa cosas de los anteriores. -->

<script src="codigo/01-configuracion.js"></script>
<!-- Va lo antes posible: aplica la paleta guardada en el teléfono apenas
     carga, para que hasta la pantalla de login se vea con los colores
     elegidos y no haya un parpadeo al color de fábrica. -->
<script src="codigo/33-paleta.js"></script>
<script src="codigo/02-utilidades.js"></script>
<script src="codigo/03-servidor.js"></script>
<script src="codigo/04-sesion.js"></script>
<script src="codigo/05-navegacion.js"></script>
<script src="codigo/06-piezas.js"></script>

<script src="codigo/08-vista-invitados.js"></script>
<script src="codigo/09-vista-dinero.js"></script>
<script src="codigo/10-planificador.js"></script>

<script src="codigo/24-etiquetas.js"></script>

<script src="codigo/26-sincronizacion.js"></script>
<!-- Usa pedir() (03) y SIN_LLEGADA (26): tiene que ir después de los dos. -->
<script src="codigo/36-optimista.js"></script>
<script src="codigo/27-buscador.js"></script>
<script src="codigo/28-escaner.js"></script>
<script src="codigo/29-fab.js"></script>

<!-- Los agentes del asistente (Paso 5): el registro primero (40), cada
     agente después — cada uno se anota solo al cargar (registrarAgente()

     funciones de todos los anteriores. Por eso el 21 y el 22 se cargan
     antes que él aunque su número sea mayor. -->
<script src="codigo/20-arranque.js"></script>

</body>
</html>
